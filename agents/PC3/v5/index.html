<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulación de Selección Natural</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">

        <header>
            <h1>🧬 Simulación de Selección Natural</h1>
            <div class="status">
                <span id="connection-status" class="status-connected">Conectado</span>
            </div>
        </header>

        <!-- Layout principal -->
        <div class="layout">

            <!-- PANEL -->
            <aside class="sidebar">
                <div class="control-panel">
                    <div class="control-section">
                        <h3>⚙️ Control</h3>
                        <button id="pause-btn" class="btn" onclick="togglePause()">⏸️ Pausar</button>

                        <label for="speed-slider">Velocidad:
                            <span id="speed-value">1.0</span>x
                        </label>
                        <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1.0"
                            oninput="updateSpeedDisplay(this.value)" onchange="setSpeed(this.value)" />

                        <div class="speed-presets">
                            <button class="preset-btn" onclick="setSpeedPreset(0.2)">🐌 Lento</button>
                            <button class="preset-btn" onclick="setSpeedPreset(1.0)">▶️ Normal</button>
                            <button class="preset-btn" onclick="setSpeedPreset(2.0)">⚡ Rápido</button>
                        </div>
                    </div>

                    <div class="control-section">
                        <h3>📊 Estadísticas</h3>
                        <div class="stats">
                            <div class="stat-item"><span>Día:</span><span id="day">0</span></div>
                            <div class="stat-item"><span>Población:</span><span id="population">0</span></div>
                            <div class="stat-item"><span>Total Nacidos:</span><span id="total-born">0</span></div>
                            <div class="stat-item"><span>Total Muertos:</span><span id="total-died">0</span></div>
                        </div>
                    </div>

                    <div class="control-section">
                        <h3>🧬 Rasgos Promedio</h3>
                        <div class="stats">
                            <div class="stat-item"><span>Velocidad:</span><span id="avg-speed">0.00</span></div>
                            <div class="stat-item"><span>Tamaño:</span><span id="avg-size">0.00</span></div>
                            <div class="stat-item"><span>Sentido:</span><span id="avg-sense">0.00</span></div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- CANVAS -->
            <section class="canvas-wrapper">
                <div class="canvas-container">
                    <canvas id="simulation-canvas" width="800" height="600"></canvas>
                    <div id="progress-bar" class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                        <span id="progress-text" class="progress-text">Día 0 - 0%</span>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script src="simulation.js"></script>
</body>

</html>
